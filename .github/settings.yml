schemaVersion: 1
settings:
    repository:
        description: にゃっはろ～！エリート巫女エンジニアのみこですっ！
        homepage: ""
        default_branch: main
        has_issues: true
        has_projects: false
        has_wiki: false
        has_discussions: false
        web_commit_signoff_required: false
        is_template: false
        allow_merge_commit: false
        allow_squash_merge: true
        allow_rebase_merge: false
        delete_branch_on_merge: true
        allow_auto_merge: true
        allow_update_branch: true
        squash_merge_commit_title: PR_TITLE
        squash_merge_commit_message: PR_BODY
        has_pull_requests: true
        pull_request_creation_policy: ALL
        issue_creation_policy: ALL
        has_sponsorships: false
        archived: false
    topics:
        names: []
    labels:
        - id: 12856280659
          name: accessibility
          color: f143ab
          description: Barrier affecting people with disabilities
        - id: 12856280639
          name: bug
          color: d73a4a
          description: Something isn't working
        - id: 12856280677
          name: documentation
          color: 0075ca
          description: Improvements or additions to documentation
        - id: 12856280712
          name: duplicate
          color: cfd3d7
          description: This issue or pull request already exists
        - id: 12856280735
          name: enhancement
          color: a2eeef
          description: New feature or request
        - id: 12856280779
          name: good first issue
          color: 7057ff
          description: Good for newcomers
        - id: 12856280762
          name: help wanted
          color: "008672"
          description: Extra attention is needed
        - id: 12856280789
          name: invalid
          color: e4e669
          description: This doesn't seem right
        - id: 12856280805
          name: question
          color: d876e3
          description: Further information is requested
        - id: 12856280822
          name: wontfix
          color: ffffff
          description: This will not be worked on
    rulesets:
        - id: 26024001
          name: default
          target: branch
          enforcement: active
          conditions:
            ref_name:
                include:
                    - ~DEFAULT_BRANCH
                exclude: []
          bypass_actors: []
          rules:
            - type: code_quality
              parameters:
                severity: errors
            - type: code_scanning
              parameters:
                code_scanning_tools:
                    - tool: CodeQL
                      alerts_threshold: errors
                      security_alerts_threshold: high_or_higher
            - type: deletion
            - type: non_fast_forward
            - type: pull_request
              parameters:
                allowed_merge_methods:
                    - squash
                dismiss_stale_reviews_on_push: true
                require_code_owner_review: true
                require_extra_approval_for_unattributed_changes: true
                require_last_push_approval: false
                required_approving_review_count: 1
                required_review_thread_resolution: true
                required_reviewers: []
            - type: required_linear_history
            - type: required_signatures
    environments: []
    actions:
        fork_pr_approval_policy: first_time_contributors
        artifact_and_log_retention_days: 90
        default_workflow_permissions: read
        can_approve_pull_request_reviews: true
        enabled: true
        allowed_actions: all
        sha_pinning_required: true
    security:
        secret_scanning: true
        secret_scanning_push_protection: true
        private_vulnerability_reporting: true
        immutable_releases: true
