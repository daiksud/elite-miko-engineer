name: approve-codex-review

on:
  issue_comment: {types: [created, edited]}
  workflow_run:
    workflows: [ci-pr]
    types: [completed]

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: codex-approval-${{ github.repository }}-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Approve the currently reviewed commit
        run: |
          set -euo pipefail

          for attempt in {0..6}; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            jq -e '.state == "open" and .draft == false' <<<"$pr" >/dev/null || exit 0
            head=$(jq -r '.head.sha' <<<"$pr")

            if [[ -n "${COMMENT_ID:-}" ]]; then
              summary=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
            else
              summary=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate --slurp |
                jq -r '[.[][] | select(.user.login == "chatgpt-codex-connector[bot]" and (.body | startswith("<!-- codex-pull-request-review-summary -->"))) | .body] | last // ""')
            fi
            state=$(sed -n 's/^<!-- codex-review-state:v1 \(.*\) -->$/\1/p' <<<"$summary")
            jq -e --arg head "$head" '
              .code_review.status == "completed" and
              .security_review.status == "completed" and
              .code_review.commit_sha == $head and
              .security_review.commit_sha == $head and
              .code_review.has_unresolved_findings == false and
              .security_review.has_unresolved_findings == false
            ' <<<"$state" >/dev/null || exit 0

            reactions=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions?per_page=100" --paginate --slurp)
            if jq -e 'any(.[][]; .user.login == "chatgpt-codex-connector[bot]" and .content == "+1")' <<<"$reactions" >/dev/null; then
              # Pin the review to the verified commit; never approve a newer push.
              current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
              jq -e --arg head "$head" '.state == "open" and .draft == false and .head.sha == $head' <<<"$current" >/dev/null || exit 0

              # A replayed summary edit must not produce a second approval.
              reviews=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --slurp)
              if jq -e --arg head "$head" 'any(.[][]; .user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == $head)' <<<"$reviews" >/dev/null; then
                exit 0
              fi
              if ! approval_response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
                -f event=APPROVE -f commit_id="$head"); then
                # Keep only validation details, never raw bodies/headers/tokens.
                if ! jq -ce 'select(type == "object") | {message, errors}' <<<"$approval_response" >&2 2>/dev/null; then
                  printf 'GitHub approval failed without a JSON validation response.\n' >&2
                fi
                exit 1
              fi
              exit 0
            fi
            [[ "$attempt" == 6 ]] || sleep 30
          done
