name: prlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: prlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prlint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out message validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install message validation tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8
          install_args: node@26.11.1 npm:@commitlint/cli@21.2.4
          cache: false

      - name: Validate current PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            mise exec node@26.11.1 npm:@commitlint/cli@21.2.4 -- commitlint --strict
