name: Bug report
description: Report something that is not working.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Actual and expected behavior
      description: Describe the problem and what should happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include steps, the affected version or commit, and relevant environment details. Do not include secrets.
    validations:
      required: true
